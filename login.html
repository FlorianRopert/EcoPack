<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion - EcoPack IA</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background: linear-gradient(135deg, #eaf8ef, #d8f0e0);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%; 
      max-width: 420px;
      background: #ffffff;
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
      border: 1px solid #e5e7eb;
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px;
      border-radius: 20px;
      background: #1f7a4d;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
    }

    .login-header h1 {
      font-size: 30px;
      color: #1f2937;
      margin-bottom: 8px;
    }

    .login-header p {
      color: #6b7280;
      font-size: 14px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #374151;
    }

    .form-group input {
      width: 100%; 
      padding: 14px 16px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-group input:focus {
      border-color: #1f7a4d;
      box-shadow: 0 0 0 3px rgba(31, 122, 77, 0.12);
    }

    .login-button {
      width: 100%; 
      border: none;
      background: #1f7a4d;
      color: white;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease;
      margin-top: 8px;
    }

    .login-button:hover {
      background: #17633d;
    }

    .login-footer {
      margin-top: 22px;
      text-align: center;
      font-size: 12px;
      color: #6b7280;
      line-height: 1.6;
    }

    .error-message {
      display: none;
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
      font-size: 13px;
    }

    .demo-box {
      margin-top: 24px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 14px;
      font-size: 13px;
      color: #4b5563;
    }

    .demo-box strong {
      display: block;
      margin-bottom: 6px;
      color: #111827;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <div class="login-logo">🌱</div>
      <h1>EcoPack IA</h1>
      <p>
        Connectez-vous pour accéder au chatbot interne et aux documents autorisés.
      </p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="login">Login</label>
        <input
          type="text"
          id="login"
          name="login"
          placeholder="Votre identifiant"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Votre mot de passe"
          required
        />
      </div>

      <button type="submit" class="login-button">Se connecter</button>

      <div id="errorMessage" class="error-message">
        Identifiants incorrects.
      </div>
    </form>

    <div class="demo-box">
      <strong>Comptes de démonstration</strong>
      Admin : <code>admin</code> / <code>admin123</code><br />
      Utilisateur : <code>jdupont</code> / <code>password123</code>
    </div>

    <div class="login-footer">
      © 2026 EcoPack - Assistant interne sécurisé
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
